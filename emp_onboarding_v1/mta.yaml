_schema-version: 3.3.0
ID: emp_onboarding_v1
description: A simple CAP project.
version: 2.0.0
modules:
- name: emp_onboarding_v1-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: emp_onboarding_v1-auth
  - name: emp_onboarding_v1-db
  - name: emp_onboarding_v1-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
    
  build-parameters:
    builder: npm-ci
- name: emp_onboarding_v1-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: emp_onboarding_v1-db
  parameters:
    buildpack: nodejs_buildpack
- name: emp_onboarding_v1-app-content
  type: com.sap.application.content
  path: .
  properties:
    BPA_DEFINITION_ID: us10.mindset-development.emponboardingprocessflow.empOnboardingProcessFlow
  requires:
  - name: emp_onboarding_v1-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - commindsetempondoarduiemponboardingui.zip
      name: commindsetempondoarduiemponboardingui
      target-path: resources/
- name: commindsetempondoarduiemponboardingui
  type: html5
  path: app/emponboarding_ui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: emp_onboarding_v1-destination-content
  type: com.sap.application.content
  requires:
  - name: emp_onboarding_v1-destination
    parameters:
      content-target: true
  - name: emp_onboarding_v1-repo-host
    parameters:
      service-key:
        name: emp_onboarding_v1-repo-host-key
  - name: emp_onboarding_v1-auth
    parameters:
      service-key:
        name: emp_onboarding_v1-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: emponbordinguilist_emp_onboarding_v1_repo_host
          ServiceInstanceName: emp_onboarding_v1-html5-service
          ServiceKeyName: emp_onboarding_v1-repo-host-key
          sap.cloud.service: emponbordinguilist
        - Authentication: OAuth2UserTokenExchange
          Name: emponbordinguilist_emp_onboarding_v1_auth
          ServiceInstanceName: emp_onboarding_v1-auth
          ServiceKeyName: emp_onboarding_v1-auth-key
          sap.cloud.service: emponbordinguilist
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
resources:
- name: emp_onboarding_v1-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: emp_onboarding_v1-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: emp_onboarding_v1-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: emp_onboarding_v1-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            Name: emp_onboarding_v1-srv
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: emp_onboarding_v1-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: emp_onboarding_v1-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
