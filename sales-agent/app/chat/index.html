<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Agent</title>
<style>
  :root {
    --ink: #1b1f23;
    --muted: #5c6670;
    --line: #dce1e6;
    --paper: #ffffff;
    --shell: #f5f7f8;
    --accent: #0a6e5c;
    --warn: #9a4a10;
    --danger: #a11f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--shell);
    color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 32px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .mode { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .mode select { font: inherit; font-size: 13px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }

  #log {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    height: 62vh;
    overflow-y: auto;
  }
  .empty { color: var(--muted); }
  .empty p { margin: 0 0 8px; }
  .empty button {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; margin: 0 6px 6px 0; font: inherit; font-size: 13px;
    color: var(--ink); cursor: pointer;
  }
  .empty button:hover { border-color: var(--accent); color: var(--accent); }

  .turn { margin-bottom: 18px; }
  .turn:last-child { margin-bottom: 0; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .turn.user .body { color: var(--accent); }
  .turn.error .body { color: var(--danger); }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .thinking { color: var(--muted); font-style: italic; }

  table { border-collapse: collapse; margin-top: 10px; font-size: 14px; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  th { background: var(--shell); font-weight: 600; }

  .approval { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--warn); border-radius: 8px; }
  .approval p { margin: 0 0 8px; font-size: 14px; color: var(--warn); }

  form { display: flex; gap: 8px; margin-top: 14px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  }
  button.go, .approval button {
    padding: 10px 18px; font: inherit; font-weight: 500;
    border: 0; border-radius: 8px; cursor: pointer; color: #fff;
  }
  button.go { background: var(--accent); }
  .approval button { background: var(--warn); padding: 7px 14px; }
  .approval button + button { background: var(--muted); margin-left: 8px; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { margin-top: 12px; font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Sales Agent</h1>
    <label class="mode">
      Route
      <select id="mode">
        <option value="a2a">Direct A2A</option>
        <option value="facade">CAP facade</option>
      </select>
    </label>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      <p>Ask about customers, products or orders. The agent reads the database through the CAP service.</p>
      <button type="button" data-q="Which products are low on stock?">Which products are low on stock?</button>
      <button type="button" data-q="Who were our top 3 customers this year?">Top 3 customers this year</button>
      <button type="button" data-q="What was revenue in APJ between 2026-01-01 and 2026-06-30?">APJ revenue, first half</button>
      <button type="button" data-q="Order 2 sensor arrays for Northwind">Order 2 sensor arrays for Northwind</button>
    </div>
  </div>

  <form id="composer">
    <input type="text" id="q" placeholder="Ask about customers, products or orders" autocomplete="off" autofocus>
    <button class="go" type="submit">Send</button>
  </form>

  <footer id="status">Not connected yet.</footer>

</div>

<script>
const A2A_ENDPOINT = '/a2a/sales-agent';
const FACADE_ENDPOINT = '/chat-api/ask';

// Development only. Remove in production and rely on the session cookie
// issued by XSUAA or IAS.
const DEV_AUTH = 'Basic ' + btoa('alice:');

let contextId = null;
let pendingTaskId = null;

const log = document.getElementById('log');
const statusBar = document.getElementById('status');
const modeSelect = document.getElementById('mode');

function esc (s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

function dropEmptyState () {
  const e = document.getElementById('empty');
  if (e) e.remove();
}

function addTurn (who, cls, html) {
  dropEmptyState();
  const el = document.createElement('div');
  el.className = 'turn ' + cls;
  el.innerHTML = '<div class="who">' + esc(who) + '</div><div class="body">' + html + '</div>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function renderTable (rows) {
  if (!Array.isArray(rows) || rows.length === 0) return '';
  const cols = Object.keys(rows[0]);
  const head = cols.map(c => '<th>' + esc(c) + '</th>').join('');
  const body = rows.map(r =>
    '<tr>' + cols.map(c => '<td>' + esc(r[c] == null ? '' : r[c]) + '</td>').join('') + '</tr>'
  ).join('');
  return '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
}

// Normalises both shapes the agent can return: a plain Message, or a Task
// carrying status.message and artifacts.
function readResult (result) {
  contextId = result.contextId || contextId;
  const state = (result.status && result.status.state) || 'completed';
  const parts = [];

  if (result.kind === 'message' || result.role === 'agent') parts.push(...(result.parts || []));
  if (result.status && result.status.message && result.status.message.parts) {
    parts.push(...result.status.message.parts);
  }
  for (const a of (result.artifacts || [])) parts.push(...(a.parts || []));

  return {
    text: parts.filter(p => typeof p.text === 'string').map(p => p.text).join('\n\n'),
    data: parts.filter(p => p.kind === 'data').map(p => p.data),
    state,
    taskId: result.id
  };
}

async function callA2A (text, taskId) {
  const message = {
    kind: 'message',
    role: 'user',
    messageId: crypto.randomUUID(),
    parts: [{ kind: 'text', text }]
  };
  if (contextId) message.contextId = contextId;
  if (taskId) message.taskId = taskId;

  const res = await fetch(A2A_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': DEV_AUTH },
    body: JSON.stringify({
      jsonrpc: '2.0',
      id: crypto.randomUUID(),
      method: 'message/send',
      params: {
        message,
        configuration: { acceptedOutputModes: ['text/plain'], blocking: true }
      }
    })
  });

  if (!res.ok) throw new Error('Agent returned HTTP ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || 'Agent error');
  return readResult(json.result || {});
}

async function callFacade (text, taskId) {
  const res = await fetch(FACADE_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': DEV_AUTH },
    body: JSON.stringify({ text, contextId, taskId })
  });

  if (!res.ok) {
    let msg = 'Facade returned HTTP ' + res.status;
    try { const e = await res.json(); if (e.error && e.error.message) msg = e.error.message; } catch (_) {}
    throw new Error(msg);
  }
  const r = await res.json();
  contextId = r.contextId || contextId;
  let data = [];
  try { data = JSON.parse(r.data || '[]'); } catch (_) {}
  return { text: r.reply, data, state: r.state, taskId: r.taskId };
}

function send (text, taskId) {
  return modeSelect.value === 'facade' ? callFacade(text, taskId) : callA2A(text, taskId);
}

function render (r) {
  let html = r.text ? esc(r.text) : '';
  for (const d of r.data) html += renderTable(Array.isArray(d) ? d : [d]);
  const el = addTurn('Agent', 'agent', html || '<span class="thinking">No content returned.</span>');

  statusBar.textContent = 'Task ' + (r.taskId || 'n/a') + ', state ' + r.state
    + (contextId ? ', conversation ' + contextId : '');

  if (r.state === 'input-required') {
    pendingTaskId = r.taskId;
    const box = document.createElement('div');
    box.className = 'approval';
    box.innerHTML = '<p>The agent is waiting for your approval before it writes to the database.</p>';

    const yes = document.createElement('button');
    yes.type = 'button';
    yes.textContent = 'Approve';
    yes.onclick = () => resume('approved', box);

    const no = document.createElement('button');
    no.type = 'button';
    no.textContent = 'Cancel';
    no.onclick = () => resume('cancel, do not place the order', box);

    box.append(yes, no);
    el.querySelector('.body').appendChild(box);
  } else {
    pendingTaskId = null;
  }

  if (r.state === 'failed') addTurn('System', 'error', 'The task failed. Check the server log.');
}

async function resume (text, box) {
  box.querySelectorAll('button').forEach(b => { b.disabled = true; });
  addTurn('You', 'user', esc(text));
  const waiting = addTurn('Agent', 'agent', '<span class="thinking">Working…</span>');
  try {
    const r = await send(text, pendingTaskId);
    waiting.remove();
    render(r);
  } catch (e) {
    waiting.remove();
    addTurn('System', 'error', esc(e.message));
  }
}

async function ask (text) {
  addTurn('You', 'user', esc(text));
  const waiting = addTurn('Agent', 'agent', '<span class="thinking">Working…</span>');
  try {
    const r = await send(text, pendingTaskId);
    waiting.remove();
    render(r);
  } catch (e) {
    waiting.remove();
    addTurn('System', 'error', esc(e.message));
    statusBar.textContent = 'Last call failed.';
  }
}

document.getElementById('composer').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('q');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  ask(text);
});

log.addEventListener('click', e => {
  const q = e.target.getAttribute && e.target.getAttribute('data-q');
  if (q) ask(q);
});
</script>
</body>
</html>
